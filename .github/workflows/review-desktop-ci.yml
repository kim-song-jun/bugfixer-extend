name: Review Desktop CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-desktop-root-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  agent-sessions:
    name: Agent session contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: whiteboard
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: whiteboard/.nvmrc
          cache: pnpm
          cache-dependency-path: whiteboard/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Record runner resources before session contracts
        run: |
          uptime
          getconf _NPROCESSORS_ONLN
          free -m
          ps -eo comm= | awk '/node/ {node++} /chrome|chromium|firefox/ {browser++} END {print "node=" node+0, "browser=" browser+0}'
      - name: Test persistence, mailboxes and managed Git worktrees
        run: pnpm --filter @dev.fast/review-desktop test:agent-sessions
      - name: Install pinned public CLIs for help-only discovery
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/agent-cli-help-tools" "$RUNNER_TEMP/agent-cli-help-home/codex" "$RUNNER_TEMP/agent-cli-help-home/claude"
          npm install --prefix "$RUNNER_TEMP/agent-cli-help-tools" --no-save --package-lock=false @openai/codex@0.163.0 @anthropic-ai/claude-code@2.1.302
      - name: Check pinned CLI help and versions without authentication
        timeout-minutes: 3
        run: |
          HOME="$RUNNER_TEMP/agent-cli-help-home" \
          CODEX_HOME="$RUNNER_TEMP/agent-cli-help-home/codex" \
          CLAUDE_CONFIG_DIR="$RUNNER_TEMP/agent-cli-help-home/claude" \
          BUGFIXER_CODEX_CLI="$RUNNER_TEMP/agent-cli-help-tools/node_modules/.bin/codex" \
          BUGFIXER_CLAUDE_CLI="$RUNNER_TEMP/agent-cli-help-tools/node_modules/.bin/claude" \
          pnpm --filter @dev.fast/review-desktop test:agent-cli-help
      - name: Remove disposable CLI help profiles and tools
        if: always()
        run: rm -rf "$RUNNER_TEMP/agent-cli-help-tools" "$RUNNER_TEMP/agent-cli-help-home"

  review-desktop:
    name: Review Desktop
    needs: agent-sessions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: whiteboard

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch legacy Review fixture commits
        shell: bash
        run: |
          mapfile -t fixture_commits < <(
            jq -r '
              objects |
              select(.sourceRepository == "devdotfast/review") |
              .baseCommit, .sourceCommit
            ' packages/review/src/fixtures/legacy-reviews/*.json |
              sort -u
          )
          test "${#fixture_commits[@]}" -gt 0
          git fetch --no-tags https://github.com/devdotfast/whiteboard.git "${fixture_commits[@]}"
          for commit in "${fixture_commits[@]}"; do
            git cat-file -e "${commit}^{commit}"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2

      - name: Setup monorepo Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: whiteboard/.nvmrc
          cache: pnpm
          cache-dependency-path: whiteboard/pnpm-lock.yaml

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright Chromium
        id: playwright-chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('whiteboard/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @dev.fast/review-canvas exec playwright install chromium --only-shell

      - name: Save Playwright Chromium
        if: steps.playwright-chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('whiteboard/pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Install Code OSS native build prerequisites
        run: |
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libkrb5-dev libsecret-1-dev python3

      - name: Install Playwright Chromium system dependencies
        run: pnpm --filter @dev.fast/review-canvas exec playwright install-deps chromium

      - name: Setup Code OSS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: whiteboard/apps/review-desktop/code-oss/.nvmrc
          cache: npm
          cache-dependency-path: whiteboard/apps/review-desktop/code-oss/**/package-lock.json

      - name: Restore Code OSS dependencies
        id: code-oss-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            whiteboard/apps/review-desktop/code-oss/node_modules
            whiteboard/apps/review-desktop/code-oss/build/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/*/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/*/server/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('whiteboard/apps/review-desktop/code-oss/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-code-oss-deps-v2-

      - name: Build Review Desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_DESKTOP_CI_FAST: "1"
        run: pnpm --filter @dev.fast/review-desktop app:build

      - name: Validate Review Desktop build
        run: |
          test -d apps/review-desktop/code-oss/node_modules
          test -f apps/review-desktop/code-oss/out/main.js

      - name: Save Code OSS dependencies
        if: steps.code-oss-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            whiteboard/apps/review-desktop/code-oss/node_modules
            whiteboard/apps/review-desktop/code-oss/build/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/*/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/*/server/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('whiteboard/apps/review-desktop/code-oss/**/package-lock.json') }}

      - name: Check the tutorial assets
        run: pnpm --filter @dev.fast/review check:tutorial

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test

      - name: Bundled diffr integration
        run: pnpm --filter @dev.fast/review test:integration:diffr

      - name: Compile macOS package payload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash apps/review-desktop/scripts/compile-darwin-payload.sh

      - name: Upload macOS package payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-desktop-darwin-payload
          path: whiteboard/apps/review-desktop/dist/darwin-payload.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-browser-diagnostics
          path: |
            whiteboard/packages/review/app/.vitest-attachments
            whiteboard/packages/review/**/__screenshots__
            whiteboard/packages/review/**/__traces__
          if-no-files-found: ignore

  review-desktop-macos-package:
    name: Review Desktop macOS ARM64 Package
    needs: review-desktop
    runs-on: macos-15
    timeout-minutes: 120
    defaults:
      run:
        working-directory: whiteboard
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2

      - name: Setup monorepo Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: whiteboard/.nvmrc
          cache: pnpm
          cache-dependency-path: whiteboard/pnpm-lock.yaml

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS package payload
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4
        with:
          name: review-desktop-darwin-payload
          path: ${{ runner.temp }}/review-desktop-payload

      - name: Restore Linux-built macOS payload
        run: zstd -d -c "$RUNNER_TEMP/review-desktop-payload/darwin-payload.tar.zst" | tar -xf -

      - name: Remove downloaded payload archive
        run: rm "$RUNNER_TEMP/review-desktop-payload/darwin-payload.tar.zst"

      - name: Setup Code OSS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: whiteboard/apps/review-desktop/code-oss/.nvmrc

      - name: Assemble and verify unsigned macOS app
        id: native_package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_DESKTOP_PRECOMPILED: "1"
          REVIEW_DESKTOP_PACKAGE_ROOT: ${{ runner.temp }}/review-desktop-package
          SKIP_NOTARIZE: "1"
        run: pnpm --filter @dev.fast/review-desktop app:package:macos

      - name: Record macOS resources before native contracts
        if: ${{ !cancelled() && steps.native_package.outcome == 'success' }}
        run: |
          uptime
          sysctl -n hw.ncpu
          vm_stat
          sysctl vm.swapusage
          ps -axo comm= | awk '/node/ {node++} /Chrome|Chromium|Firefox|Whiteboard/ {browser++} END {print "node=" node+0, "browser=" browser+0}'

      - name: Native shared-folder and worktree launch contracts
        if: ${{ !cancelled() && steps.native_package.outcome == 'success' }}
        timeout-minutes: 5
        run: pnpm --filter @dev.fast/review-desktop test:agent-session-workspaces

      - name: Native project dashboard smoke
        if: ${{ !cancelled() && steps.native_package.outcome == 'success' }}
        run: node apps/review-desktop/scripts/smoke-native-dashboard-visual.mjs "$RUNNER_TEMP/review-desktop-package/VSCode-darwin-arm64/Whiteboard.app" "$RUNNER_TEMP/review-desktop-native-ui-smoke"

      - name: Native AI session PTY contracts
        if: ${{ !cancelled() && steps.native_package.outcome == 'success' }}
        timeout-minutes: 5
        run: ELECTRON_RUN_AS_NODE=1 "$RUNNER_TEMP/review-desktop-package/VSCode-darwin-arm64/Whiteboard.app/Contents/MacOS/Whiteboard" apps/review-desktop/scripts/smoke-native-agent-pty.mjs "$RUNNER_TEMP/review-desktop-package/VSCode-darwin-arm64/Whiteboard.app" "$RUNNER_TEMP/review-desktop-native-pty-smoke"

      - name: Native project-window session IPC contracts
        if: ${{ !cancelled() && steps.native_package.outcome == 'success' }}
        timeout-minutes: 5
        working-directory: whiteboard/apps/review-desktop
        run: |
          app="$RUNNER_TEMP/review-desktop-package/VSCode-darwin-arm64/Whiteboard.app"
          export BUGFIXER_NATIVE_PTY_NODE="$app/Contents/Resources/app/review-runtime/bin/node"
          export BUGFIXER_NATIVE_PTY_GUARDIAN="$app/Contents/Resources/app/out/vs/workspace/electron-main/agentSessions/pty/agentPtyGuardian.mjs"
          export BUGFIXER_NATIVE_PTY_REQUIRED=1
          test -x "$BUGFIXER_NATIVE_PTY_NODE"
          test -f "$BUGFIXER_NATIVE_PTY_GUARDIAN"
          ELECTRON_RUN_AS_NODE=1 TSX_TSCONFIG_PATH=tsconfig.test.json "$app/Contents/MacOS/Whiteboard" --import ./scripts/test-code-oss-preload.mjs --import tsx --test --test-concurrency=1 code-oss/src/vs/workspace/electron-main/workspaceAgentSessionsChannel.test.ts

      - name: Upload native PTY evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-desktop-native-pty-smoke
          path: ${{ runner.temp }}/review-desktop-native-pty-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Upload native UI smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-desktop-native-ui-smoke
          path: ${{ runner.temp }}/review-desktop-native-ui-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Archive unsigned macOS app
        run: ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/review-desktop-package/VSCode-darwin-arm64/Whiteboard.app" "$RUNNER_TEMP/review-desktop-macos-arm64-unsigned.zip"

      - name: Upload unsigned macOS app for native QA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-desktop-macos-arm64-unsigned
          path: ${{ runner.temp }}/review-desktop-macos-arm64-unsigned.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
