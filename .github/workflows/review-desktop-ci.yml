name: Review Desktop CI

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: review-desktop-root-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-desktop:
    name: Review Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: whiteboard

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Fetch legacy Review fixture commits
        shell: bash
        run: |
          mapfile -t fixture_commits < <(
            jq -r '
              objects |
              select(.sourceRepository == "devdotfast/review") |
              .baseCommit, .sourceCommit
            ' packages/review/src/fixtures/legacy-reviews/*.json |
              sort -u
          )
          test "${#fixture_commits[@]}" -gt 0
          git fetch --no-tags https://github.com/devdotfast/whiteboard.git "${fixture_commits[@]}"
          for commit in "${fixture_commits[@]}"; do
            git cat-file -e "${commit}^{commit}"
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.1.2

      - name: Setup monorepo Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: whiteboard/.nvmrc
          cache: pnpm
          cache-dependency-path: whiteboard/pnpm-lock.yaml

      - name: Install monorepo dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Playwright Chromium
        id: playwright-chromium
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('whiteboard/pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.playwright-chromium.outputs.cache-hit != 'true'
        run: pnpm --filter @dev.fast/review-canvas exec playwright install chromium --only-shell

      - name: Save Playwright Chromium
        if: steps.playwright-chromium.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-${{ hashFiles('whiteboard/pnpm-lock.yaml') }}

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Install Code OSS native build prerequisites
        run: |
          echo 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbfile-dev libkrb5-dev libsecret-1-dev python3

      - name: Install Playwright Chromium system dependencies
        run: pnpm --filter @dev.fast/review-canvas exec playwright install-deps chromium

      - name: Setup Code OSS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: whiteboard/apps/review-desktop/code-oss/.nvmrc
          cache: npm
          cache-dependency-path: whiteboard/apps/review-desktop/code-oss/**/package-lock.json

      - name: Restore Code OSS dependencies
        id: code-oss-deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            whiteboard/apps/review-desktop/code-oss/node_modules
            whiteboard/apps/review-desktop/code-oss/build/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/*/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/*/server/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('whiteboard/apps/review-desktop/code-oss/**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-code-oss-deps-v2-

      - name: Build Review Desktop
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REVIEW_DESKTOP_CI_FAST: "1"
        run: pnpm --filter @dev.fast/review-desktop app:build

      - name: Validate Review Desktop build
        run: |
          test -d apps/review-desktop/code-oss/node_modules
          test -f apps/review-desktop/code-oss/out/main.js

      - name: Save Code OSS dependencies
        if: steps.code-oss-deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            whiteboard/apps/review-desktop/code-oss/node_modules
            whiteboard/apps/review-desktop/code-oss/build/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/*/node_modules
            whiteboard/apps/review-desktop/code-oss/extensions/*/server/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/remote/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/distro/npm/remote/web/node_modules
            whiteboard/apps/review-desktop/code-oss/.build/electron
            ~/.cache/node-gyp
          key: ${{ runner.os }}-code-oss-deps-v2-${{ hashFiles('whiteboard/apps/review-desktop/code-oss/**/package-lock.json') }}

      - name: Check the tutorial assets
        run: pnpm --filter @dev.fast/review check:tutorial

      - name: Typecheck and test
        run: pnpm typecheck && pnpm test

      - name: Bundled diffr integration
        run: pnpm --filter @dev.fast/review test:integration:diffr

      - name: Upload browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vitest-browser-diagnostics
          path: |
            whiteboard/packages/review/app/.vitest-attachments
            whiteboard/packages/review/**/__screenshots__
            whiteboard/packages/review/**/__traces__
          if-no-files-found: ignore
