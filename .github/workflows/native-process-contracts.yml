name: Native process contracts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-process-contracts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  native-process-contracts:
    name: macOS process identity cleanup
    runs-on: macos-15
    timeout-minutes: 5
    defaults:
      run:
        working-directory: whiteboard/apps/review-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Code OSS Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: whiteboard/apps/review-desktop/code-oss/.nvmrc

      - name: Record macOS resources before process contracts
        run: |
          uptime
          sysctl -n hw.ncpu
          vm_stat
          sysctl vm.swapusage
          ps -axo comm= | awk '/node/ {node++} /Chrome|Chromium|Firefox|Whiteboard/ {browser++} END {print "node=" node+0, "browser=" browser+0}'

      - name: Native app process identity cleanup contracts
        timeout-minutes: 3
        run: node --test --test-reporter=tap --test-concurrency=1 scripts/native/app-process-cleanup.test.mjs

      - name: AX PID and CF output-pointer bridge ABI diagnostic
        timeout-minutes: 2
        run: |
          node --input-type=module <<'NODE'
          import { spawn } from 'node:child_process';

          const probes = [
            {
              kind: 'ax-pid',
              script: 'ax-pid-bridge-probe.js',
              mode: 'metadata-ref',
            },
            {
              kind: 'ax-pid',
              script: 'ax-pid-bridge-probe.js',
              mode: 'bound-int-ref',
            },
            {
              kind: 'cf-output',
              script: 'cf-output-bridge-probe.js',
              mode: 'bound-id-ref',
            },
            {
              kind: 'cf-output',
              script: 'cf-output-bridge-probe.js',
              mode: 'bound-pointer-ref',
            },
          ];
          const allowedPhases = new Set([
            'IMPORT',
            'INPUT',
            'OWN_PID',
            'FIXTURE',
            'FUNCTION_BINDING',
            'APPLICATION',
            'ELEMENT_TYPE',
            'PID_BINDING',
            'PID_QUERY',
            'PID_VALUE',
            'OUTPUT_REF',
            'FIXTURE_READBACK',
            'DICTIONARY_LOOKUP',
            'OUTPUT_VALUE',
            'VALUE_TYPE',
            'VALUE_EQUALITY',
            'COMPLETE',
          ]);
          const results = [];
          let cfOutputTypedContractPassed = false;

          for (const probeCase of probes) {
            const { kind, script, mode } = probeCase;
            const startedAt = Date.now();
            const child = spawn('/usr/bin/osascript', [
              '-l',
              'JavaScript',
              `scripts/native/${script}`,
              mode,
            ], {
              stdio: ['ignore', 'pipe', 'ignore'],
            });
            const childPID = child.pid;
            let stdout = '';
            let stdoutBytes = 0;
            let outputTooLarge = false;
            let timedOut = false;
            let closed = false;
            let exitObserved = false;
            let spawnFailed = false;
            let parseFailed = false;
            let stopRequested = false;
            let killTimer;
            const stopChild = () => {
              if (closed || exitObserved || stopRequested) return;
              stopRequested = true;
              child.kill('SIGTERM');

              killTimer = setTimeout(() => {
                if (!closed && !exitObserved) child.kill('SIGKILL');
              }, 1000);
            };
            const timeout = setTimeout(() => {
              if (closed) return;
              timedOut = true;
              stopChild();
            }, 10_000);

            child.stdout.on('data', chunk => {
              const text = chunk.toString('utf8');
              stdoutBytes += Buffer.byteLength(text, 'utf8');

              if (stdoutBytes > 4096) {
                outputTooLarge = true;

                stopChild();

                return;
              }

              stdout += text;
            });
            child.once('error', () => {
              spawnFailed = true;
            });

            let exitCode = null;
            let exitSignal = null;
            const outcome = await new Promise(resolve => {
              const closeDeadline = setTimeout(() => {
                if (closed) return;
                clearTimeout(timeout);
                clearTimeout(killTimer);
                child.stdout.destroy();
                child.unref();
                resolve({ closed: false });
              }, 13_000);

              child.once('exit', (code, signal) => {
                exitObserved = true;
                exitCode = code;
                exitSignal = signal;
                clearTimeout(timeout);
                clearTimeout(killTimer);
              });
              child.once('close', (exitCode, signal) => {
                closed = true;
                clearTimeout(timeout);
                clearTimeout(killTimer);
                clearTimeout(closeDeadline);
                resolve({ closed: true, exitCode, signal });
              });
            });
            const finalExitCode = outcome.closed ? outcome.exitCode : exitCode;
            const finalSignal = outcome.closed ? outcome.signal : exitSignal;
            let cleanupStatus = 'unverified';

            if (outcome.closed && exitObserved &&
                Number.isSafeInteger(childPID) && childPID > 0) {
              try {
                process.kill(childPID, 0);
                cleanupStatus = 'present-or-reused';
              } catch (error) {
                cleanupStatus = error.code === 'ESRCH' ? 'absent' : 'unknown';
              }
            }
            const cleanupVerified = outcome.closed && exitObserved &&
              cleanupStatus === 'absent';

            let probe = null;

            if (!spawnFailed && !timedOut && !outputTooLarge) {
              try {
                probe = JSON.parse(stdout);
              } catch {
                parseFailed = true;
                probe = null;
              }
            }

            const expectedKeys = kind === 'ax-pid'
              ? 'errorCode,mode,ownPID,phase,returnedPID,status'
              : 'errorCode,fixtureVerified,found,mode,ownPID,phase,valueTypeMatches,valuesEqual';
            const validShape = probe !== null &&
              Object.keys(probe).sort().join(',') === expectedKeys &&
              probe.mode === mode &&
              (probe.ownPID === null ||
                (Number.isSafeInteger(probe.ownPID) &&
                  probe.ownPID > 0 && probe.ownPID <= 2_147_483_647)) &&
              allowedPhases.has(probe.phase) &&
              (probe.errorCode === null ||
                [
                  'invalid-mode',
                  'own-pid-unavailable',
                  'element-type-mismatch',
                  'status-invalid',
                  'ax-error-status-nonzero',
                  'returned-pid-invalid',
                  'returned-pid-mismatch',
                  'bridge-operation-threw',
                  'fixture-value-unavailable',
                  'fixture-value-not-cfstring',
                  'fixture-value-mismatch',
                  'cf-lookup-key-not-found',
                  'output-value-unavailable',
                  'output-value-not-cfstring',
                  'output-value-mismatch',
                ].includes(probe.errorCode));

            const axPIDShapeValid = kind !== 'ax-pid' ||
              (probe !== null &&
                (probe.status === null ||
                  (Number.isSafeInteger(probe.status) &&
                    probe.status >= -2_147_483_648 &&
                    probe.status <= 2_147_483_647)) &&
                (probe.returnedPID === null ||
                  (Number.isSafeInteger(probe.returnedPID) &&
                    probe.returnedPID > 0 &&
                    probe.returnedPID <= 2_147_483_647)));
            const cfOutputShapeValid = kind !== 'cf-output' ||
              (probe !== null &&
                (probe.fixtureVerified === true ||
                  probe.fixtureVerified === false) &&
                (probe.found === null || probe.found === true ||
                  probe.found === false) &&
                (probe.valueTypeMatches === null ||
                  probe.valueTypeMatches === true ||
                  probe.valueTypeMatches === false) &&
                (probe.valuesEqual === null ||
                  probe.valuesEqual === true || probe.valuesEqual === false));
            const receiptShapeValid = validShape && axPIDShapeValid &&
              cfOutputShapeValid;

            const identityMatches = receiptShapeValid &&
              probe.ownPID === childPID;
            const invocation = {
              mode,
              kind,
              command: `osascript -l JavaScript scripts/native/${script}`,
              cwd: 'whiteboard/apps/review-desktop',
              parentPID: process.pid,
              childPID: Number.isSafeInteger(childPID) ? childPID : null,
              startedAtEpochMilliseconds: startedAt,
              elapsedMs: Date.now() - startedAt,
              exitObserved,
              closed: outcome.closed,
              exitCode: finalExitCode,
              signal: finalSignal,
              cleanupStatus,
              cleanupVerified,
              timedOut,
              outputTooLarge,
              spawnFailed,
              parseFailed,
              identityMatches,
              probe: receiptShapeValid ? probe : null,
            };
            results.push(invocation);
            process.stdout.write(`${JSON.stringify(invocation)}\n`);

            const processLifecycleVerified = receiptShapeValid &&
              identityMatches && outcome.closed && exitObserved &&
              finalExitCode === 0 && finalSignal === null &&
              cleanupVerified && !timedOut && !outputTooLarge &&
              !spawnFailed && !parseFailed;
            const axPIDContractPassed = kind !== 'ax-pid' ||
              (receiptShapeValid && probe.phase === 'COMPLETE' &&
                probe.status === 0 && probe.errorCode === null &&
                probe.returnedPID === probe.ownPID && finalExitCode === 0 &&
                finalSignal === null && !parseFailed);
            const cfOutputContractPassed = kind !== 'cf-output' ||
              (receiptShapeValid && probe.phase === 'COMPLETE' &&
                probe.fixtureVerified === true &&
                probe.found === true && probe.valueTypeMatches === true &&
                probe.valuesEqual === true && probe.errorCode === null &&
                finalExitCode === 0 && finalSignal === null && !parseFailed);

            if (kind === 'cf-output' &&
                (mode === 'bound-pointer-ref' || mode === 'bound-id-ref') &&
                cfOutputContractPassed) {
              cfOutputTypedContractPassed = true;
            }

            if (!processLifecycleVerified ||
                (kind === 'ax-pid' && !axPIDContractPassed)) {
              process.exitCode = 1;
            }

            if (!processLifecycleVerified) break;
          }

          if (!cfOutputTypedContractPassed) {
            process.exitCode = 1;
          }

          process.stdout.write(`${JSON.stringify({
            event: 'cf-output-pointer-probe-summary',
            parentPID: process.pid,
            cfOutputTypedContractPassed,
            results,
          })}\n`);
          NODE

      - name: Record remaining Node process identities
        if: ${{ always() }}
        run: ps -axo pid=,ppid=,pgid=,stat=,comm= | awk '/node/ {print}'
